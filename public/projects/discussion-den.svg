      </text>

      <!-- Code Snippet inside Post -->
      <rect x="86" y="135" width="706" height="50" rx="8" fill="#0b1120" stroke="#1e293b"/>
      <text x="106" y="165" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="12">
        db.session.query(Post).options(joinedload(Post.comments)).filter(Post.is_active == True)
      </text>

      <!-- Post Footer Badges -->
      <g transform="translate(86, 200)">
        <rect x="0" y="0" width="130" height="30" rx="8" fill="#0b1120" stroke="#1e293b"/>
        <text x="65" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">💬 38 Comments</text>

        <rect x="142" y="0" width="110" height="30" rx="8" fill="#0b1120" stroke="#1e293b"/>
        <text x="197" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">🔗 Share Link</text>

        <rect x="264" y="0" width="120" height="30" rx="8" fill="#0b1120" stroke="#1e293b"/>
        <text x="324" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">🔖 Saved Post</text>
      </g>

      <!-- Post 2 (Nested Community Thread) -->
      <rect x="0" y="270" width="816" height="255" rx="20" fill="#131d33" stroke="#1e2d4d" stroke-width="1.5"/>
      
      <rect x="24" y="294" width="46" height="85" rx="10" fill="#0b1120" stroke="#1e2e4e"/>
      <path d="M 47 310 L 37 324 L 57 324 Z" fill="#818cf8"/>
      <text x="47" y="346" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" text-anchor="middle">89</text>
      <path d="M 47 368 L 37 356 L 57 356 Z" fill="#64748b"/>

      <text x="86" y="314" fill="#818cf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">r/python-async-patterns</text>
      <text x="280" y="314" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">• Posted 4 hours ago</text>

      <text x="86" y="348" fill="#f8fafc" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="bold">
        Session Isolation &amp; Persona Switching with Flask-Login and Google OAuth 2.0
      </text>

      <!-- Nested Comment Box -->
      <rect x="86" y="375" width="706" height="80" rx="10" fill="#0b1120" stroke="#1e2d4d"/>
      <line x1="106" y1="390" x2="106" y2="440" stroke="#38bdf8" stroke-width="2"/>
      <text x="120" y="408" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold">@alex_dev • Lead Engineer</text>
      <text x="120" y="430" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">
        &ldquo;The modular blueprint routing keeps our controller layer completely decoupled.&rdquo;
      </text>

      <g transform="translate(86, 470)">
        <rect x="0" y="0" width="130" height="30" rx="8" fill="#0b1120" stroke="#1e293b"/>
        <text x="65" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">💬 19 Comments</text>
      </g>
