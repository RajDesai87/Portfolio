    <g transform="translate(304, 0)">
      <!-- Post 1 (Featured) -->
      <rect x="0" y="0" width="816" height="250" rx="20" fill="#131d33" stroke="#1e2d4d" stroke-width="1.5"/>
      
      <!-- Upvote Pill -->
      <rect x="24" y="24" width="46" height="85" rx="10" fill="#0b1120" stroke="#1e2e4e"/>
      <path d="M 47 40 L 37 54 L 57 54 Z" fill="#38bdf8"/>
      <text x="47" y="76" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" text-anchor="middle">142</text>
      <path d="M 47 98 L 37 86 L 57 86 Z" fill="#64748b"/>

      <!-- Post Header Info -->
      <text x="86" y="44" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">r/backend-engineering</text>
      <text x="260" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">• Posted by @raj_desai 2 hours ago</text>
      
      <!-- Post Title -->
      <text x="86" y="80" fill="#f8fafc" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="bold">
        Benchmarking SQLAlchemy ORM vs Raw Asyncpg in PostgreSQL
      </text>

      <!-- Post Body Snippet -->
      <text x="86" y="115" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" leading="1.6">
